manifestVersion: 1
name: "@swamp/agent-runner"
version: "2026.10.29.1"
license: "AGPL-3.0-or-later"
description: |
  Run AI coding agents (Claude, Codex) with structured output for CI
  integration. Manages agent CLI binaries, resolves API tokens from
  environment variables or vaults (or uses the CLI's stored login), and
  returns machine-readable verdicts that CI pipelines can gate on.

  Provider-agnostic: each agent backend (Claude Code CLI, OpenAI Codex CLI)
  is a pluggable provider with its own binary management and CLI flag
  translation. The common interface is prompt in, structured result out.

  ## Methods

  | Method   | What it does |
  | -------- | ------------ |
  | `review` | Run a coding agent review against a set of files and return a structured verdict (pass/fail) with findings. Supports an optional `diff` input for inline diff review mode (faster, no repo exploration). |
  | `run`    | Run an arbitrary prompt through a coding agent and return the output. |

  Both methods accept optional `model` and `effort` arguments (`effort` is
  low, medium, high, xhigh or max, passed as claude `--effort` or codex
  `model_reasoning_effort`).

  Both results carry a `usage` object with the token counts (and, for
  claude, the cost in USD) that the agent CLI reported, per model and in
  total, and the CLI's `sessionId`. Both are absent when the CLI reports
  none. Needs Claude Code 1.0.37+ or Codex 0.122.0+.

  Runs on Linux, macOS and Windows (x64 and ARM64). On Windows the claude
  provider needs Git for Windows. The Codex provider downloads the
  @openai/codex platform package from npm and keeps its bundled sandbox
  helpers; the Claude binary is verified against the checksum in its release
  manifest.
  Codex can run through an OpenAI-compatible gateway with a `modelProvider`
  provider config.

  ## Providers

  | Provider | CLI           | API key env var     |
  | -------- | ------------- | ------------------- |
  | `claude` | Claude Code   | `ANTHROPIC_API_KEY` |
  | `codex`  | OpenAI Codex  | `CODEX_API_KEY`     |

  ## Usage

  ```bash
  swamp extension pull @swamp/agent-runner

  swamp model create @swamp/agent-runner reviewer
  swamp model edit reviewer

  swamp model method run reviewer review \
    --input promptFile=.forgejo/prompts/review.md \
    --input 'files:json=["src/main.ts","src/lib.ts"]' \
    --json
  ```
repository: "https://github.com/swamp-club/swamp-extensions"
models:
  - agent_runner.ts
additionalFiles:
  - LICENSE.txt
  - README.md
platforms:
  - darwin-aarch64
  - darwin-x86_64
  - linux-aarch64
  - linux-x86_64
  - windows-x86_64
labels:

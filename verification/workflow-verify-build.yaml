id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
name: verify-build
description: |
  Build verification for swamp-extensions. Pull-request CI does not build
  anything, so this is the build gate: the per-directory checks in
  scripts/run_checks.ts for every directory the change touches, the
  dependency and Actions audits, codegen idempotency, and the model
  upgrade-path gate. Runs on the host in a fresh git worktree checked out at
  the verified commit.
version: 1

tags:
  purpose: pre-pr-verification

inputs:
  properties:
    commit:
      type: string
      description: Commit SHA being verified.
    branch:
      type: string
      description: Branch name being verified.
  required:
    - commit
    - branch

reports:
  require:
    - "@swamp/verification-summary"

concurrency: 8

jobs:
  # ── Fresh Checkout ──────────────────────────────────────────
  - name: setup
    description: Create a clean worktree at the verified commit.
    steps:
      - name: checkout
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-setup-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              # Concurrent verifications share refs/remotes/origin/main; the
              # loser of the ref update fails with "incorrect old value".
              # The retry finds the ref current, so it has nothing to write.
              git fetch origin main || { sleep 1; git fetch origin main; }
              CHECKOUT_DIR="/tmp/swamp-verify-build-${{ run.id }}"
              rm -rf "$CHECKOUT_DIR"
              git worktree prune
              git worktree add --detach "$CHECKOUT_DIR" "${{ inputs.commit }}"

  # ── Detect Changes ──────────────────────────────────────────
  # Only for the codegen idempotency guard. scripts/run_checks.ts does its own
  # per-directory change detection.
  - name: detect-changes
    description: Determine whether codegen changed.
    dependsOn:
      - job: setup
        condition:
          type: succeeded
    steps:
      - name: changed-dirs
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-detect-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              # Captured first so a failed diff fails the step instead of
              # vanishing into the pipe and skipping the idempotency check.
              CHANGED=$(git -c core.quotePath=false diff --name-only --no-renames origin/main...HEAD)
              if printf '%s\n' "$CHANGED" | grep -q "^codegen/"; then
                echo "CHANGED_CODEGEN: true"
              fi
              echo "=== Detection complete ==="
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ── Checks ──────────────────────────────────────────────────
  # One step per group so the checklist and attestation show which failed.
  # A group the change does not touch passes with nothing to check.
  - name: checks
    description: Run the per-directory checks for every changed directory.
    dependsOn:
      - job: setup
        condition:
          type: succeeded
    steps:
      - name: extensions
        # Hand-written extensions: check, lint, fmt, test, lockfile.
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-extensions-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              deno run --allow-read --allow-write --allow-env --allow-run --allow-net \
                scripts/run_checks.ts --group extensions --base origin/main --concurrency 2
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: vaults
        # Vault extensions.
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-vaults-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              deno run --allow-read --allow-write --allow-env --allow-run --allow-net \
                scripts/run_checks.ts --group vaults --base origin/main --concurrency 2
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: datastores
        # Datastore extensions.
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-datastores-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              deno run --allow-read --allow-write --allow-env --allow-run --allow-net \
                scripts/run_checks.ts --group datastores --base origin/main --concurrency 2
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: models
        # Changed generated models in full, plus the sample services and
        # single-directory providers whenever model/ or codegen/ changes.
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-models-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              deno run --allow-read --allow-write --allow-env --allow-run --allow-net \
                scripts/run_checks.ts --group models --base origin/main --concurrency 2
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: codegen
        # The codegen pipeline: check, lint, fmt, lockfile.
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-codegen-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              deno run --allow-read --allow-write --allow-env --allow-run --allow-net \
                scripts/run_checks.ts --group codegen --base origin/main --concurrency 2
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: harness
        # The root issue-lifecycle working copy and the verification scripts.
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-harness-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              deno run --allow-read --allow-write --allow-env --allow-run --allow-net \
                scripts/run_checks.ts --group harness --base origin/main --concurrency 2
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ── Audits ──────────────────────────────────────────────────
  - name: audit
    description: Dependency vulnerability and Actions pinning audits.
    dependsOn:
      - job: setup
        condition:
          type: succeeded
    steps:
      - name: deps-audit
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-deps-audit-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              deno run --allow-read --allow-net=api.osv.dev \
                --allow-env=GITHUB_STEP_SUMMARY --allow-write scripts/audit_deps.ts
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: actions-audit
        # Unauthenticated GitHub API calls unless GITHUB_TOKEN is set.
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-actions-audit-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              deno run --allow-read --allow-net=api.github.com \
                --allow-env=GITHUB_STEP_SUMMARY,GITHUB_TOKEN --allow-write \
                scripts/audit_actions.ts
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ── Codegen Idempotency ─────────────────────────────────────
  - name: codegen-verify
    description: Verify codegen is idempotent (second run produces zero diff).
    # Regeneration rewrites model/ in the shared worktree, so it waits for
    # every job that reads it — otherwise checks could fail at random, or
    # check freshly generated code instead of the commit.
    dependsOn:
      - job: detect-changes
        condition:
          type: succeeded
      - job: checks
        condition:
          type: always
      - job: audit
        condition:
          type: always
      - job: upgrade-verify
        condition:
          type: always
    steps:
      - name: idempotency
        # A guard skips its step when true: skip unless codegen changed.
        guard: "${{ !data.latest('build-detect-' + run.id, 'result').attributes.stdout.contains('CHANGED_CODEGEN: true') }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-codegen-idem-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              cd codegen

              echo "=== Fetching schemas (Hetzner + DigitalOcean) ==="
              deno task fetch-schema:hetzner
              deno task fetch-schema:digitalocean

              echo "=== First generation (Hetzner + DigitalOcean) ==="
              deno task generate:hetzner
              deno task generate:digitalocean

              echo "=== Checking for diffs after first generation ==="
              FIRST_DIFF=$(git diff --name-only)
              if [ -n "$FIRST_DIFF" ]; then
                echo "First generation produced expected diffs:"
                echo "$FIRST_DIFF"
              fi

              echo "=== Second generation (idempotency canary) ==="
              deno task generate:hetzner
              deno task generate:digitalocean

              echo "=== Checking for NEW diffs after second generation ==="
              SECOND_DIFF=$(git diff --name-only)
              if [ "$FIRST_DIFF" != "$SECOND_DIFF" ]; then
                echo "::error::Second generation produced new diffs — codegen is not idempotent"
                git diff --stat
                exit 1
              fi

              echo "Codegen idempotency verified"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ── Model Upgrade Gate ──────────────────────────────────────
  # Every model whose own `version` this change bumps — generated or
  # hand-written, wherever it lives — must end its upgrades list with that
  # version, and an instance of the published extension must upgrade to it
  # from the local source. Both steps list every model they examined.
  - name: upgrade-verify
    description: Check upgrade entries and the upgrade path for bumped models.
    dependsOn:
      - job: setup
        condition:
          type: succeeded
    steps:
      - name: check-upgrades
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-upgrade-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              deno run --allow-read --allow-run=git \
                scripts/check_upgrades.ts --base origin/main
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: upgrade-path-test
        dependsOn:
          - step: check-upgrades
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-upgrade-path-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              deno run --allow-read --allow-write --allow-env --allow-run \
                scripts/check_upgrades.ts --base origin/main --path-test
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ── Cleanup ─────────────────────────────────────────────────
  - name: cleanup
    description: Remove the temporary worktree.
    dependsOn:
      - job: checks
        condition:
          type: always
      - job: audit
        condition:
          type: always
      - job: codegen-verify
        condition:
          type: always
      - job: upgrade-verify
        condition:
          type: always
    steps:
      - name: remove-worktree
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-cleanup-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              CHECKOUT_DIR="/tmp/swamp-verify-build-${{ run.id }}"
              git worktree remove --force "$CHECKOUT_DIR" 2>/dev/null || true
              git worktree prune
              # Remove ephemeral auto-definitions created for this run
              REPO_ROOT="$(git rev-parse --git-common-dir)/.."
              find "$REPO_ROOT/.swamp/auto-definitions" -name "*-${{ run.id }}.yaml" -delete 2>/dev/null || true
            ignoreExitCode: true

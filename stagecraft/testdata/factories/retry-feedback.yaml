schemaVersion: 2
description: >-
  An LLM method produces a plan; a rejected payload is fed back on retry.
stages:
  - id: planning
    initial: true
    description: An LLM produces a plan; malformed output is fed back on retry.
    work:
      mode: method
      description: >-
        The feedback let value is the whole validation record, null-safe: null
        on the first attempt, the recorded rejection on a retry.
      method:
        modelIdOrName: "@my/planner"
        methodName: generate
        passAsInputs: [workItem, feedback]
      let:
        workItem: item.key
        feedback: >-
          "plan" in validations.artifacts ? validations.artifacts["plan"] : null
      resultEvidence: plan-run
    artifacts:
      - name: plan
        schema:
          type: object
          required: [scope, risks]
          additionalProperties: false
          properties:
            scope: { type: string, minLength: 1 }
            risks:
              type: array
              items: { type: string }
    transitions:
      - name: submit
        to: done
        gates:
          - type: artifact-exists
            config: { artifact: plan }
  - id: done
    terminal: true

name: "@swamp/stagecraft/publish"
description: "Replay a work item's journal to its ticket: what publish does, for any tracker. Run it again after each step; it delivers only what is new."
version: 1
inputs:
  properties:
    tracker:
      type: string
      description: "The tracker instance the factory is bound to: a tracker stagecraft ships, or a publisher for a tracker written as a separate extension"
    workItem:
      type: string
      description: The work item's key
  required:
    - tracker
    - workItem
jobs:
  - name: round-1
    description: Plan the first round
    steps:
      - name: round
        task:
          type: model_method
          modelIdOrName: ${{ inputs.tracker }}
          methodName: round
          inputs:
            kind: publish
            run: ${{ run.id }}
            workItem: ${{ inputs.workItem }}
  - name: write-1
    description: Make the round's writes on the tracker, in order
    dependsOn:
      - job: round-1
        condition:
          type: completed
    steps:
      - name: operate
        forEach:
          item: op
          in: ${{ data.latest(inputs.tracker, "round-publish-" + run.id).attributes.opIds }}
        concurrency: 1
        guard: ${{ data.latest(inputs.tracker, "round-publish-" + run.id).attributes.byId[self.op].prev != "" && (data.latest(data.latest(inputs.tracker, "round-publish-" + run.id).attributes.byId[self.op].tracker, data.latest(inputs.tracker, "round-publish-" + run.id).attributes.byId[self.op].prev) == null || data.latest(data.latest(inputs.tracker, "round-publish-" + run.id).attributes.byId[self.op].tracker, data.latest(inputs.tracker, "round-publish-" + run.id).attributes.byId[self.op].prev).attributes.ok != true) }}
        task:
          type: model_method
          modelIdOrName: ${{ data.latest(inputs.tracker, "round-publish-" + run.id).attributes.byId[self.op].tracker }}
          methodName: operate
          inputs:
            operation: ${{ data.latest(inputs.tracker, "round-publish-" + run.id).attributes.byId[self.op].operation }}
            request: ${{ data.latest(inputs.tracker, "round-publish-" + run.id).attributes.byId[self.op].request }}
            answer: ${{ data.latest(inputs.tracker, "round-publish-" + run.id).attributes.byId[self.op].answer }}
            run: ${{ run.id }}

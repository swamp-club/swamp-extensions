id: 4343d3d9-9017-4696-a90f-d1b06c31cbb7
name: "@swamp/stagecraft/conformance"
description: "Check that a tracker meets the tracker contract: the checks stagecraft's own trackers pass, made through its operate one call at a time. It files and changes tickets, so point it at a tracker kept for testing."
version: 1
inputs:
  properties:
    tracker:
      type: string
      description: "The tracker instance the factory is bound to: a tracker stagecraft ships, or a publisher for a tracker written as a separate extension"
    statusNames:
      type: string
      description: Two status names the tracker has, comma-separated; a new ticket starts in neither
    createType:
      type: string
      description: A type create accepts
    missing:
      type: string
      description: A well-formed stable id of no ticket
    entryStatus:
      type: string
      description: "For a tracker that keeps history: a status name entries may carry"
      default: ""
    entryTypes:
      type: string
      description: "For a tracker that keeps history: two ticket types, comma-separated; a new ticket is in neither"
      default: ""
    user:
      type: string
      description: "For a tracker that assigns: a user it accepts"
      default: ""
  required:
    - tracker
    - statusNames
    - createType
    - missing
jobs:
  - name: round-1
    description: Plan the first round
    steps:
      - name: round
        task:
          type: model_method
          modelIdOrName: ${{ inputs.tracker }}
          methodName: round
          inputs:
            kind: conformance
            run: ${{ run.id }}
            statusNames: ${{ inputs.statusNames }}
            createType: ${{ inputs.createType }}
            missing: ${{ inputs.missing }}
            entryStatus: ${{ inputs.entryStatus }}
            entryTypes: ${{ inputs.entryTypes }}
            user: ${{ inputs.user }}
  - name: write-1
    description: Make the round's writes on the tracker, in order
    dependsOn:
      - job: round-1
        condition:
          type: completed
    steps:
      - name: operate
        forEach:
          item: op
          in: ${{ data.latest(inputs.tracker, "round-conformance-" + run.id).attributes.opIds }}
        concurrency: 1
        guard: ${{ data.latest(inputs.tracker, "round-conformance-" + run.id).attributes.byId[self.op].prev != "" && (data.latest(data.latest(inputs.tracker, "round-conformance-" + run.id).attributes.byId[self.op].tracker, data.latest(inputs.tracker, "round-conformance-" + run.id).attributes.byId[self.op].prev) == null || data.latest(data.latest(inputs.tracker, "round-conformance-" + run.id).attributes.byId[self.op].tracker, data.latest(inputs.tracker, "round-conformance-" + run.id).attributes.byId[self.op].prev).attributes.ok != true) }}
        task:
          type: model_method
          modelIdOrName: ${{ data.latest(inputs.tracker, "round-conformance-" + run.id).attributes.byId[self.op].tracker }}
          methodName: operate
          inputs:
            operation: ${{ data.latest(inputs.tracker, "round-conformance-" + run.id).attributes.byId[self.op].operation }}
            request: ${{ data.latest(inputs.tracker, "round-conformance-" + run.id).attributes.byId[self.op].request }}
            answer: ${{ data.latest(inputs.tracker, "round-conformance-" + run.id).attributes.byId[self.op].answer }}
            run: ${{ run.id }}
  - name: round-2
    description: Record the last round's answers and plan the next
    dependsOn:
      - job: write-1
        condition:
          type: completed
    steps:

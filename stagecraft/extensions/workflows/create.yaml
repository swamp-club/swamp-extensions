id: e0443507-7a20-48b2-bfed-25d06a9bb172
name: "@swamp/stagecraft/create"
description: File a new ticket on the tracker and record it; a retry after the tracker accepted it files another.
version: 1
inputs:
  properties:
    tracker:
      type: string
      description: "The tracker instance the factory is bound to: a tracker stagecraft ships, or a publisher for a tracker written as a separate extension"
    title:
      type: string
      description: The ticket's title
    body:
      type: string
      description: The ticket's body, as markdown
      default: ""
    type:
      type: string
      description: One of the tracker's types
  required:
    - tracker
    - title
    - type
jobs:
  - name: round-1
    description: Plan the first round
    steps:
      - name: round
        task:
          type: model_method
          modelIdOrName: ${{ inputs.tracker }}
          methodName: round
          inputs:
            kind: create
            run: ${{ run.id }}
            title: ${{ inputs.title }}
            body: ${{ inputs.body }}
            type: ${{ inputs.type }}
  - name: write-1
    description: Make the round's writes on the tracker, in order
    dependsOn:
      - job: round-1
        condition:
          type: completed
    steps:
      - name: operate
        forEach:
          item: op
          in: ${{ data.latest(inputs.tracker, "round-create-" + run.id).attributes.opIds }}
        concurrency: 1
        guard: ${{ data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].prev != "" && (data.latest(data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].tracker, data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].prev) == null || data.latest(data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].tracker, data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].prev).attributes.ok != true) }}
        task:
          type: model_method
          modelIdOrName: ${{ data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].tracker }}
          methodName: operate
          inputs:
            operation: ${{ data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].operation }}
            request: ${{ data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].request }}
            answer: ${{ data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].answer }}
            run: ${{ run.id }}
  - name: read-1
    description: Read the ticket the round needs
    dependsOn:
      - job: write-1
        condition:
          type: completed
    steps:
      - name: operate
        forEach:
          item: op
          in: ${{ data.latest(inputs.tracker, "round-create-" + run.id).attributes.readIds }}
        concurrency: 1
        guard: ${{ data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].prev != "" && (data.latest(data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].tracker, data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].prev) == null || data.latest(data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].tracker, data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].prev).attributes.ok != true) }}
        task:
          type: model_method
          modelIdOrName: ${{ data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].tracker }}
          methodName: operate
          inputs:
            operation: ${{ data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].operation }}
            request: ${{ data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].request }}
            answer: ${{ data.latest(inputs.tracker, "round-create-" + run.id).attributes.byId[self.op].answer }}

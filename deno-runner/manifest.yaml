manifestVersion: 1
name: "@swamp/deno-runner"
version: "2026.10.17.1"
license: "AGPL-3.0-or-later"
description: |
  Install and run Deno commands. Manages Deno binary downloads with
  checksum verification and provides generic command execution for CI
  and development workflows.

  Runs on Linux and macOS (x64 and ARM64) and Windows x64. The binary is
  unpacked in process, so no unzip tool is needed.

  Provider-agnostic: does not impose any project structure or command
  conventions. You specify the Deno version and the arguments to run.

  ## Methods

  | Method    | What it does |
  | --------- | ------------ |
  | `install` | Ensure a specific Deno version is downloaded and cached. Returns the binary path and platform info. |
  | `run`     | Run an arbitrary `deno` subcommand with the specified arguments (e.g. `check`, `test`, `lint`, `fmt`, `install --frozen`). Fails the step on non-zero exit. |
  | `task`    | Run a named task from `deno.json` with optional extra arguments. Fails the step on non-zero exit. |

  ## Usage

  ```bash
  swamp extension pull @swamp/deno-runner

  swamp model create @swamp/deno-runner deno
  swamp model edit deno

  # Type-check
  swamp model method run deno run \
    --input 'args:json=["check", "src/main.ts"]'

  # Run tests
  swamp model method run deno run \
    --input 'args:json=["test", "--allow-read", "--allow-env", "src/"]'

  # Run a named task
  swamp model method run deno task \
    --input taskName=generate:aws \
    --input 'taskArgs:json=["ec2", "s3"]'

  # Verify lockfile
  swamp model method run deno run \
    --input 'args:json=["install", "--frozen"]'
  ```
repository: "https://github.com/swamp-club/swamp-extensions"
models:
  - deno_runner.ts
additionalFiles:
  - LICENSE.txt
  - README.md
platforms:
  - darwin-aarch64
  - darwin-x86_64
  - linux-aarch64
  - linux-x86_64
  - windows-x86_64
labels:
  - deno
  - ci
  - runtime
  - toolchain

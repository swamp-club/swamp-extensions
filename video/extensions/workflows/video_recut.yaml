id: 47892e33-4a0e-4b25-9c99-e8d2e0638488
name: "@swamp/video/video-recut"
description: "Re-render a take after editing: read edit.txt (hand edits, or chat edits already written there) back into the edit list, then render again. Transcript and screen analysis are reused. Pass takes to join several edited recordings into one video."
version: 1
inputs:
  properties:
    recordingPath:
      type: string
      description: The recording to re-render; or pass takes
      default: ""
    takes:
      type: array
      items:
        type: string
      description: Two or more recordings, each already through video-edit, to join into one video in this order
      default: []
    output:
      type: string
      description: "takes: path of the joined files without their suffix (default: the first take's, plus .joined)"
      default: ""
    bedMode:
      type: string
      description: "Where the bed plays: waits or full (empty uses the media instance's setting)"
      default: ""
    editFile:
      type: string
      description: "edit.txt to read (default: <recording>.video/edit.txt)"
      default: ""
    title:
      type: string
      default: ""
    subtitle:
      type: string
      default: ""
    kicker:
      type: string
      default: Demo
    cards:
      type: string
      default: simple
    cardsFrom:
      type: string
      default: ""
    media:
      type: string
      default: ""
    pixelate:
      type: boolean
      default: true
    burn:
      type: boolean
      default: true
jobs:
  - name: recut
    description: Import edit.txt, render
    steps:
      - name: check-inputs
        description: "Fail before the slow steps when the cards can't be made (render's own check: resolveCards in _lib/cards.ts)"
        task:
          type: assert
          expr: >-
            inputs.cards != "simple" || inputs.title != ""
          message: "cards mode simple needs a title: pass --input title=..., or --input cards=none"
      - name: check-takes
        description: One recording, or two or more takes; a single editFile can't serve several takes
        task:
          type: assert
          expr: >-
            (inputs.recordingPath != "" && size(inputs.takes) == 0) ||
            (inputs.recordingPath == "" && size(inputs.takes) >= 2 && inputs.editFile == "")
          message: "pass recordingPath, or takes with two or more recordings, not both; editFile only works with recordingPath"
      - name: check-bed
        description: Fail before rendering on an unknown bedMode, or a full-length bed with no settings to come from
        task:
          type: assert
          expr: >-
            (inputs.bedMode == "" || inputs.bedMode == "waits" || inputs.bedMode == "full") &&
            (inputs.bedMode != "full" || inputs.media != "")
          message: "bedMode is waits or full, and full needs a media instance with a bed: pass --input media=..."
      - name: import
        dependsOn:
          - step: check-inputs
            condition:
              type: succeeded
          - step: check-takes
            condition:
              type: succeeded
          - step: check-bed
            condition:
              type: succeeded
        forEach:
          item: rec
          in: "${{ size(inputs.takes) > 0 ? inputs.takes : [inputs.recordingPath] }}"
        concurrency: 1
        task:
          type: behavior
          behaviorType: "@swamp/video/edit"
          behaviorName: video-edit
          methodName: import
          inputs:
            recordingPath: ${{ self.rec }}
            path: ${{ inputs.editFile }}
      - name: render
        dependsOn:
          - step: import
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: "@swamp/video/render"
          behaviorName: video-render
          methodName: render
          inputs:
            recordingPath: ${{ inputs.recordingPath }}
            takes: ${{ inputs.takes }}
            output: ${{ inputs.output }}
            bedMode: ${{ inputs.bedMode }}
            edit: video-edit
            screen: video-screen
            pixelate: ${{ inputs.pixelate }}
            media: ${{ inputs.media }}
            burn: ${{ inputs.burn }}
            cards:
              mode: ${{ inputs.cards }}
              title: ${{ inputs.title }}
              subtitle: ${{ inputs.subtitle }}
              kicker: ${{ inputs.kicker }}
              from: ${{ inputs.cardsFrom }}

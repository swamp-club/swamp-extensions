id: a9f08324-8a06-4848-9422-471079363557
name: "@swamp/video/brand/video-edit"
description: "Turn a screen recording into a finished demo video in the Swamp Club look: render the brand cards (intro, lower third, outro with QR code, fast-forward badge) for the presenter, then run @swamp/video's video-edit with them."
version: 1
inputs:
  properties:
    recordingPath:
      type: string
      description: The recording to edit (any format ffmpeg reads, e.g. an OBS .mkv)
    title:
      type: string
      description: Headline on the intro
    subtitle:
      type: string
      default: ""
    episode:
      type: string
      description: "Label above the title, e.g. Tutorial or Episode 3"
      default: Demo
    presenter:
      type: string
      description: The @swamp/video/presenter instance who is on screen
      default: presenter
    media:
      type: string
      description: A @swamp/video/media instance with render settings (optional)
      default: ""
    retakeMarkers:
      type: array
      items:
        type: number
      description: Raw times (seconds) a retake was marked, e.g. by a hotkey
      default: []
    pixelate:
      type: boolean
      description: Pixelate credentials found on screen
      default: true
    burn:
      type: boolean
      description: Also write a burned-caption video
      default: true
  required:
    - recordingPath
    - title
jobs:
  - name: edit
    description: Brand cards, then the edit and render
    steps:
      - name: cards
        description: Intro, outro with QR code, lower third and fast-forward badge for this take
        task:
          type: behavior
          behaviorType: "@swamp/video/brand"
          behaviorName: video-brand
          methodName: cards
          inputs:
            recordingPath: ${{ inputs.recordingPath }}
            presenter: ${{ inputs.presenter }}
            title: ${{ inputs.title }}
            subtitle: ${{ inputs.subtitle }}
            episode: ${{ inputs.episode }}
      - name: video-edit
        description: Transcribe, watch the screen, build the edit list and render with the brand cards
        dependsOn:
          - step: cards
            condition:
              type: succeeded
        task:
          type: workflow
          workflowIdOrName: "@swamp/video/video-edit"
          inputs:
            recordingPath: ${{ inputs.recordingPath }}
            title: ${{ inputs.title }}
            subtitle: ${{ inputs.subtitle }}
            kicker: ${{ inputs.episode }}
            cards: brand
            cardsFrom: video-brand
            media: ${{ inputs.media }}
            retakeMarkers: ${{ inputs.retakeMarkers }}
            pixelate: ${{ inputs.pixelate }}
            burn: ${{ inputs.burn }}

# An adversarial plan review as a stage template: consumes a plan, produces
# findings, and leaves through approved or rework. Its reviewer skills and
# blocking severities are parameters, filled in when it is applied.
schemaVersion: 1
name: review-plan
description: Adversarial review of a plan, with a human sign-off.
contract:
  inputs:
    - { kind: artifact, name: plan }
  outputs:
    - { kind: artifact, name: plan-review }
  exits:
    - { name: approved, description: Findings clear and a human signed off. }
    - { name: rework, description: The plan needs another pass. }
  parameters:
    type: object
    additionalProperties: false
    properties:
      skills:
        type: array
        items: { type: string }
        minItems: 1
        default: [adversarial-review]
      blocking:
        type: array
        items: { enum: [critical, high, medium, low] }
        minItems: 1
        default: [critical, high]
stages:
  - id: review
    initial: true
    work:
      mode: dispatch
      skills: { $param: skills }
      systemPrompt: |
        Adversarially review the injected plan. Try to refute it. Record
        findings with severities; do not soften them.
      context:
        inject: [plan]
    artifacts:
      - name: plan-review
        kind: findings
        reviews: plan
    transitions:
      - name: approve
        exit: approved
        gates:
          - type: artifact-fresh
            config: { artifact: plan-review, recordedThisCycle: true }
          - type: findings-clear
            config: { artifact: plan-review, blocking: { $param: blocking } }
          - type: human-approval
            config: { id: plan-approval }
      - name: rework
        exit: rework

schemaVersion: 1
name: feature-factory
description: >-
  plan → adversarial plan review → implement → tests → adversarial code
  review → done, with loop-backs and human approval at plan and ship.
stages:
  - id: planning
    initial: true
    description: Produce an implementation plan from the work item.
    work:
      mode: interactive
      skills: [planning]
      constraints: agent-constraints/planning-conventions.md
    artifacts:
      - name: plan
        schema:
          type: object
          required: [summary, steps, testingStrategy]
          properties:
            summary: { type: string, minLength: 1 }
            steps:
              type: array
              minItems: 1
              items:
                type: object
                required: [description]
                properties:
                  description: { type: string }
                  files: { type: array, items: { type: string } }
            testingStrategy: { type: string }
    transitions:
      - name: submit
        to: plan-review
        gates:
          - type: artifact-exists
            config: { artifact: plan }

  - id: plan-review
    description: Adversarial review of the current plan.
    work:
      mode: dispatch
      skills: [architecture, accessibility]
      systemPrompt: |
        You are an adversarial reviewer. Try to refute this plan:
        {{planSummary}}
        Record findings with severities; do not soften them.
      bindings:
        planSummary: artifacts["plan"].payload.summary
      context:
        inject: [plan]
    artifacts:
      - name: plan-review
        kind: findings
        reviews: plan
    transitions:
      - name: approve
        to: implementing
        gates:
          - type: artifact-fresh
            config: { artifact: plan-review, recordedThisCycle: true }
          - type: findings-clear
            config: { artifact: plan-review, blocking: [critical, high] }
          - type: human-approval
            config: { id: plan-approval }
      - name: rework
        to: planning
        description: The plan was not approved, so planning revises it.

  - id: implementing
    description: The primary agent implements the approved plan.
    work:
      mode: interactive
      skills: [implementation]
      constraints: agent-constraints/implementation-conventions.md
    artifacts:
      - name: change-summary
        schema:
          type: object
          required: [summary, headSha]
          properties:
            summary: { type: string }
            headSha: { type: string, minLength: 7 }
    evidence:
      - name: change-request
        schema:
          type: object
          required: [url, headSha]
          properties:
            url: { type: string, format: uri }
            headSha: { type: string, minLength: 7 }
    transitions:
      - name: submit
        to: testing
        gates:
          - type: artifact-exists
            config: { artifact: change-summary }
          - type: evidence-recorded
            config: { name: change-request }

  - id: testing
    description: Run the test suite against the current work. No LLM involved.
    work:
      mode: workflow
      workflow:
        name: "@acme/run-tests"
      bindings:
        ref: evidence["change-request"].payload.headSha
      resultEvidence: test-run
    transitions:
      - name: passed
        to: code-review
        gates:
          - type: evidence-recorded
            config: { name: test-run, requireField: { status: succeeded } }
      - name: failed
        to: implementing
        description: The tests failed, so implementing fixes the code.
        gates:
          - type: evidence-recorded
            config: { name: test-run, requireField: { status: failed } }

  - id: code-review
    description: Adversarial review of the implemented change, same skills.
    work:
      mode: dispatch
      skills: [architecture, accessibility]
      systemPrompt: |
        You are an adversarial reviewer. Review the change at {{changeUrl}}
        against the plan. Record findings with severities.
      bindings:
        changeUrl: evidence["change-request"].payload.url
      context:
        inject: [plan, change-summary]
    artifacts:
      - name: code-review
        kind: findings
        reviews: change-summary
    transitions:
      - name: accept
        to: done
        gates:
          - type: artifact-fresh
            config: { artifact: code-review, recordedThisCycle: true }
          - type: findings-clear
            config: { artifact: code-review, blocking: [critical, high] }
          - type: human-approval
            config: { id: ship-approval }
      - name: rework
        to: implementing
        description: The code review asked for changes, so implementing makes them.

  - id: done
    terminal: true

  - id: aborted
    terminal: true

globalTransitions:
  - name: abort
    to: aborted
    gates:
      - type: human-approval
        config: { id: abort-confirmation }

# The starter lifecycle written by hand: what applying the starter stage
# templates to starter-sketch.yaml must give (templates_test.ts). It is the
# core of lifecycles/build-swamp-extension.yaml (plan, plan review,
# implement, check, code review, release), made generic:
#
# - verify runs a command the stage names and records checks; there is no
#   quality score and no quality waiver.
# - The plan has no versionBump, and change-summary no manifestVersion.
# - implement has no guard against resubmitting the commit already checked:
#   that reads verify's evidence, which implement cannot take as an input.
# - The approvals (plan-approval, release-approval, abandon-confirmation) and
#   release are the lifecycle's; the stage templates carry none.
schemaVersion: 1
name: starter
description: Plan, review the plan, implement, verify, review the change, release.

stages:
  - id: plan
    initial: true
    projection: { status: triaged }
    description: Plan the change.
    work:
      mode: interactive
      skills: []
      systemPrompt: |
        Plan the change with the person. Read the code it touches first.
        Record plan with a summary, the steps in order (each naming the files
        it touches) and the testing strategy. After a review sends the plan
        back, read the findings and record the plan again.
    artifacts:
      - name: plan
        schema:
          type: object
          required: [summary, steps, testingStrategy]
          properties:
            summary: { type: string, minLength: 1 }
            steps:
              type: array
              minItems: 1
              items:
                type: object
                required: [description, files]
                additionalProperties: false
                properties:
                  description: { type: string, minLength: 1 }
                  files: { type: array, items: { type: string, minLength: 1 } }
            testingStrategy: { type: string, minLength: 1 }
    transitions:
      - name: submit
        to: plan-review
        gates:
          - type: artifact-exists
            config: { artifact: plan }

  - id: plan-review
    projection: { status: triaged }
    description: >-
      Adversarial review of the current plan. Open blocking findings send it
      back; none lets it through.
    work:
      mode: dispatch
      skills: [adversarial-review]
      systemPrompt: |
        You are an adversarial reviewer. Try to refute this plan:
        {{planSummary}}
        Check its steps against the code and its testing strategy against the
        risks. Record findings with severities; do not soften them.
      bindings:
        planSummary: artifacts["plan"].payload.summary
      context:
        inject: [plan]
    artifacts:
      - name: plan-review
        kind: findings
        reviews: plan
    transitions:
      - name: approve
        to: implement
        gates:
          - type: artifact-fresh
            config: { artifact: plan-review, recordedThisCycle: true }
          - type: findings-clear
            config: { artifact: plan-review, blocking: [critical, high] }
          - type: human-approval
            config: { id: plan-approval }
      - name: rework
        to: plan
        gates:
          - type: artifact-fresh
            config: { artifact: plan-review, recordedThisCycle: true }
          - type: findings-open
            config: { artifact: plan-review, blocking: [critical, high] }
      - name: revise
        to: plan
        manual: true
        description: >-
          A person sent the plan back without a blocking finding. Manual, so
          it never fires on its own.

  - id: implement
    projection: { status: in_progress }
    description: Implement the plan and commit it.
    work:
      mode: interactive
      skills: []
      systemPrompt: |
        Implement the plan. Commit the work, then record change-summary with
        the full 40-character SHA of the commit to check and review. Do not
        open a pull request. After a check or review sends the work back, fix
        it, commit, and record change-summary again for the new commit.
      context:
        inject: [plan]
    artifacts:
      - name: change-summary
        schema:
          type: object
          required: [summary, commit, files]
          properties:
            summary: { type: string, minLength: 1 }
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
            files: { type: array, minItems: 1, items: { type: string } }
    transitions:
      - name: submit
        to: verify
        gates:
          - type: artifact-exists
            config: { artifact: change-summary }

  - id: verify
    projection: { status: in_progress }
    description: >-
      Run the checks on the change-summary commit and record checks, with one
      result per check.
    work:
      mode: interactive
      systemPrompt: |
        Check out commit {{commit}} and run the stage's command. Record checks
        with that commit, the overall status, and one result per check (its
        name, status and, when it failed, the output that shows why). Record
        only what you ran and saw.
      command: >-
        swamp extension fmt --check; deno check on the extension's files;
        deno lint; deno test
      bindings:
        commit: artifacts["change-summary"].payload.commit
    evidence:
      - name: checks
        schema:
          type: object
          required: [commit, status, results]
          properties:
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
            status: { enum: [passed, failed] }
            results:
              type: array
              minItems: 1
              items:
                type: object
                required: [name, status]
                additionalProperties: false
                properties:
                  name: { type: string, minLength: 1 }
                  status: { enum: [passed, failed, skipped] }
                  detail: { type: string }
          # An overall pass cannot contain a failed result.
          if:
            properties: { status: { const: passed } }
          then:
            properties:
              results:
                not:
                  contains:
                    properties: { status: { const: failed } }
    transitions:
      - name: passed
        to: code-review
        gates:
          - type: evidence-recorded
            config: { name: checks, requireField: { status: passed } }
          - type: cel
            config:
              expr: >-
                evidence["checks"].payload.commit ==
                artifacts["change-summary"].payload.commit
              message: checks must be for the change-summary commit
      - name: failed
        to: implement
        gates:
          - type: evidence-recorded
            config: { name: checks, requireField: { status: failed } }

  - id: code-review
    projection: { status: in_progress }
    description: >-
      Adversarial review of the change. Open blocking findings send it back;
      none lets it through.
    work:
      mode: dispatch
      skills: [code-review]
      systemPrompt: |
        You are an adversarial reviewer. Review commit {{commit}}:
        {{changeSummary}}
        Check it against the plan. Record findings with severities; do not
        soften them.
      bindings:
        commit: artifacts["change-summary"].payload.commit
        changeSummary: artifacts["change-summary"].payload.summary
      context:
        inject: [plan, change-summary]
    artifacts:
      - name: code-review
        kind: findings
        reviews: change-summary
    transitions:
      - name: accept
        to: release
        gates:
          - type: artifact-fresh
            config: { artifact: code-review, recordedThisCycle: true }
          - type: findings-clear
            config: { artifact: code-review, blocking: [critical, high] }
          - type: human-approval
            config: { id: release-approval }
      - name: rework
        to: implement
        gates:
          - type: artifact-fresh
            config: { artifact: code-review, recordedThisCycle: true }
          - type: findings-open
            config: { artifact: code-review, blocking: [critical, high] }
      - name: revise
        to: implement
        manual: true
        description: >-
          A person sent the change back without a blocking finding. Manual, so
          it never fires on its own.

  - id: release
    projection: { status: in_progress }
    description: Release the reviewed commit.
    work:
      mode: interactive
      systemPrompt: |
        Release the reviewed commit, and record release with the commit that
        shipped and where.
    evidence:
      - name: release
        schema:
          type: object
          required: [commit, url]
          properties:
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
            url: { type: string, format: uri }
    transitions:
      - name: released
        to: done
        gates:
          - type: evidence-recorded
            config: { name: release }
      - name: rework
        to: implement
        manual: true
        description: The release was blocked; go back and change the work.

  - id: done
    terminal: true
    projection: { status: shipped }

  - id: abandoned
    terminal: true
    projection: { status: closed }

globalTransitions:
  - name: abandon
    to: abandoned
    gates:
      - type: human-approval
        config: { id: abandon-confirmation }

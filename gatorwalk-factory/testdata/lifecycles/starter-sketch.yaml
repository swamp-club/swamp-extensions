# The starter stage templates' lifecycle, sketched: one placeholder stage per
# stage template, in flow order, and the lifecycle's own release, done and
# abandoned. Each placeholder's transitions name where the stage template's
# exits go, and the approvals are the lifecycle's, on those transitions.
# Applying templates/{plan,review-plan,implement,verify,review}.yaml in that
# order gives starter-core.yaml (templates_test.ts, integration/cli_test.ts).
schemaVersion: 1
name: starter
description: Plan, review the plan, implement, verify, review the change, release.

stages:
  - id: plan
    initial: true
    description: Placeholder for the plan stage template.
    transitions:
      - { name: submitted, to: plan-review }

  - id: plan-review
    description: Placeholder for the review-plan stage template.
    transitions:
      - name: approved
        to: implement
        gates:
          - type: human-approval
            config: { id: plan-approval }
      - { name: rework, to: plan }

  - id: implement
    description: Placeholder for the implement stage template.
    transitions:
      - { name: submitted, to: verify }

  - id: verify
    description: Placeholder for the verify stage template.
    transitions:
      - { name: passed, to: code-review }
      - { name: failed, to: implement }

  - id: code-review
    description: Placeholder for the review stage template.
    transitions:
      - name: accepted
        to: release
        gates:
          - type: human-approval
            config: { id: release-approval }
      - { name: rework, to: implement }

  - id: release
    projection: { status: in_progress }
    description: Release the reviewed commit.
    work:
      mode: interactive
      systemPrompt: |
        Release the reviewed commit, and record release with the commit that
        shipped and where.
    evidence:
      - name: release
        schema:
          type: object
          required: [commit, url]
          properties:
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
            url: { type: string, format: uri }
    transitions:
      - name: released
        to: done
        gates:
          - type: evidence-recorded
            config: { name: release }
      - name: rework
        to: implement
        manual: true
        description: The release was blocked; go back and change the work.

  - id: done
    terminal: true
    projection: { status: shipped }

  - id: abandoned
    terminal: true
    projection: { status: closed }

globalTransitions:
  - name: abandon
    to: abandoned
    gates:
      - type: human-approval
        config: { id: abandon-confirmation }

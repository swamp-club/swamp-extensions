# A starter stage template: run the checks on the committed change and record
# the outcome. The agent runs the command the stage names; a team replaces the
# default (swamp extension checks) with its own. Every multi-stage lifecycle
# has a step like this. Approvals, and any waiver, belong to the lifecycle.
schemaVersion: 1
name: verify
description: Run the checks on the change-summary commit and record the outcome.
contract:
  inputs:
    - { kind: artifact, name: change-summary }
  outputs:
    - { kind: evidence, name: checks }
  exits:
    - {
        name: passed,
        description: The checks passed on the change-summary commit.,
      }
    - { name: failed, description: A check failed. }
  parameters:
    type: object
    additionalProperties: false
    properties:
      command:
        description: >-
          What the agent runs, in order; each check becomes one result in
          checks.
        type: string
        minLength: 1
        default: >-
          swamp extension fmt --check; deno check on the extension's files;
          deno lint; deno test
stages:
  - id: verify
    initial: true
    projection: { status: in_progress }
    description: >-
      Run the checks on the change-summary commit and record checks, with one
      result per check.
    work:
      mode: interactive
      systemPrompt: |
        Check out commit {{commit}} and run the stage's command. Record checks
        with that commit, the overall status, and one result per check (its
        name, status and, when it failed, the output that shows why). Record
        only what you ran and saw.
      command: { $param: command }
      bindings:
        commit: artifacts["change-summary"].payload.commit
    evidence:
      - name: checks
        schema:
          type: object
          required: [commit, status, results]
          properties:
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
            status: { enum: [passed, failed] }
            results:
              type: array
              minItems: 1
              items:
                type: object
                required: [name, status]
                additionalProperties: false
                properties:
                  name: { type: string, minLength: 1 }
                  status: { enum: [passed, failed, skipped] }
                  detail: { type: string }
          # An overall pass cannot contain a failed result.
          if:
            properties: { status: { const: passed } }
          then:
            properties:
              results:
                not:
                  contains:
                    properties: { status: { const: failed } }
    transitions:
      - name: passed
        exit: passed
        gates:
          - type: evidence-recorded
            config: { name: checks, requireField: { status: passed } }
          - type: cel
            config:
              expr: >-
                evidence["checks"].payload.commit ==
                artifacts["change-summary"].payload.commit
              message: checks must be for the change-summary commit
      - name: failed
        exit: failed
        gates:
          - type: evidence-recorded
            config: { name: checks, requireField: { status: failed } }

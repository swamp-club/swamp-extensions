# A starter stage template: an adversarial review of a plan. It consumes a
# plan, produces findings, and leaves through approved (a fresh review with no
# open blocking finding) or rework (a fresh review with one). Its reviewer
# skills and blocking severities are parameters. Approvals belong to the
# lifecycle: put them on the placeholder's approved transition.
schemaVersion: 1
name: review-plan
description: Adversarial review of a plan.
contract:
  inputs:
    - { kind: artifact, name: plan }
  outputs:
    - { kind: artifact, name: plan-review }
  exits:
    - {
        name: approved,
        description: A fresh review with no open blocking finding.,
      }
    - { name: rework, description: The plan needs another pass. }
  parameters:
    type: object
    additionalProperties: false
    properties:
      skills:
        description: Skills the reviewing subagents load.
        type: array
        items: { type: string, minLength: 1 }
        minItems: 1
        default: [adversarial-review]
      blocking:
        description: Severities that block approval and send the plan back.
        type: array
        items: { enum: [critical, high, medium, low] }
        minItems: 1
        default: [critical, high]
stages:
  - id: plan-review
    initial: true
    projection: { status: triaged }
    description: >-
      Adversarial review of the current plan. Open blocking findings send it
      back; none lets it through.
    work:
      mode: dispatch
      skills: { $param: skills }
      systemPrompt: |
        You are an adversarial reviewer. Try to refute this plan:
        {{planSummary}}
        Check its steps against the code and its testing strategy against the
        risks. Record findings with severities; do not soften them.
      bindings:
        planSummary: artifacts["plan"].payload.summary
      context:
        inject: [plan]
    artifacts:
      - name: plan-review
        kind: findings
        reviews: plan
    transitions:
      - name: approve
        exit: approved
        gates:
          - type: artifact-fresh
            config: { artifact: plan-review, recordedThisCycle: true }
          - type: findings-clear
            config: { artifact: plan-review, blocking: { $param: blocking } }
      - name: rework
        exit: rework
        gates:
          - type: artifact-fresh
            config: { artifact: plan-review, recordedThisCycle: true }
          - type: findings-open
            config: { artifact: plan-review, blocking: { $param: blocking } }
      - name: revise
        exit: rework
        manual: true
        description: >-
          A person sent the plan back without a blocking finding. Manual, so
          it never fires on its own.

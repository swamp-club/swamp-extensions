schemaVersion: 1
name: swamp-club-swamp-extensions
description: |-
  A real-world example: a swamp-club Lab issue in swamp-extensions, from
  triage through verification, the pull request and release to the session
  summary.

  For reading, not for copying whole: it shows a full process with a
  tracker, a verification workflow, attestation and pull requests, and it
  depends on that repository (the agent-constraints/ conventions its prompts
  cite, the verification/ workflows and its forge). To build one like it,
  start from starter.yaml and borrow the stages you need.

  Change first, if you copy it whole: the verify stage's workflow, the
  pull-request command and the conventions the prompts cite.

  This is the process swamp-extensions runs with @swamp/issue-lifecycle and
  agent-constraints/verification-conventions.md, written as a gatorwalk
  factory definition. A work item on it drives a Lab issue end to end through
  the swamp-club adapter (@swamp/gatorwalk-factory/swamp-club), so the issue
  reads the same as one issue-lifecycle drives. issue-lifecycle stays, and
  drives every other issue: the adapter's claim refuses an issue it already
  drives. swamp-club-swamp-extensions.md maps every phase, gate and human stop
  onto this factory definition and lists what the format could not express.

  The work item never talks to swamp-club itself. The adapter's publish
  replays its journal to the issue: each stage's projection names the Lab
  status and the lifecycle entries (issue-lifecycle's step names) its events
  become, and the classification sets the issue type. attest and notify post
  the attestation and the contributor's thank-you through the adapter.

  People decide at: a bug that cannot be reproduced, plan approval, the
  verification checklist, opening the pull request, what to do after a
  failed pull request, completing the work early (issue-lifecycle's complete,
  from attest or merge), and abandoning the work. Every exit past implement is
  bound to the commit named in change-summary, the commit that was reviewed
  and verified. Commits are full 40-character SHAs.

  The CEL vocabulary is in extensions/models/_lib/engine/cel_context.ts. In CEL,
  evidence["x"] is the latest record of x in the era from any stage, unlike
  the evidence-recorded gate, which only accepts evidence from the current
  stage and cycle. implement.submit and attest.attested depend on it.

stages:
  - id: triage
    initial: true
    maxCycles: 5
    projection:
      entries:
        - on: enter
          step: triage_started
          emoji: "🔍"
          summary: "Triage started"
          status: open
        - on: { record: classification }
          match: { isRegression: true }
          step: classified
          emoji: "📋"
          summary: "Classified as {{type}} (regression) ({{confidence}})"
          status: triaged
          setsType: type
        - on: { record: classification }
          match: { isRegression: false }
          step: classified
          emoji: "📋"
          summary: "Classified as {{type}} ({{confidence}})"
          status: triaged
          setsType: type
    description: >-
      Classify the issue. A low-confidence classification carries the
      questions for the person and stops here until it is recorded again with
      their answers. A classification with a regression verdict, confirmed
      or downgraded, waits for a person to approve regression-review. The
      classification records the effective flag, as issue-lifecycle's triage
      sends it: isRegression is true only with a confirmed verdict, so the
      Lab's regression flag is set, cleared or left as the verdict says, and
      the classified entry says "(regression)" only then. A bug goes to reproduction;
      anything else to planning. There is one exit per type, named as
      issue-lifecycle's classifications are; the confidence check is a gate of
      its own, so a type mismatch on a sibling exit never shows its message.
      maxCycles states the default of five entries as the process's choice
      (see plan).
    work:
      mode: interactive
      systemPrompt: |
        Read the issue and the code it touches, following
        agent-constraints/triage-conventions.md. Classify it as bug, feature,
        platform or security. If you believe it is a regression, gather the
        evidence for it, argue against it, reach a verdict, record it, and
        show both sides and the verdict to the person, who approves
        regression-review (confirmed or downgraded) before the bug moves on.
        Always record isRegression: true only with a confirmed verdict, and
        false otherwise, including with a downgraded verdict. Record
        regressionIntroducedIn only with a confirmed verdict.
        If you cannot classify it
        confidently, record confidence low with your questions, and record the
        classification again once the person has answered.

        gatorwalk drives this issue: do not use the issue-lifecycle skill or
        run any @swamp/issue-lifecycle method, even when a request would
        trigger it.
    evidence:
      - name: classification
        schema:
          type: object
          required: [type, confidence, reasoning, isRegression]
          additionalProperties: false
          properties:
            type: { enum: [bug, feature, platform, security] }
            confidence: { enum: [high, medium, low] }
            reasoning: { type: string, minLength: 1 }
            clarifyingQuestions:
              type: array
              minItems: 1
              items: { type: string, minLength: 1 }
            isRegression: { type: boolean }
            regressionEvidence: { type: string, minLength: 1 }
            regressionCounterEvidence: { type: string, minLength: 1 }
            regressionVerdict: { enum: [confirmed, downgraded] }
            regressionVerdictReasoning: { type: string, minLength: 1 }
            regressionIntroducedIn: { type: string, minLength: 1 }
          allOf:
            - if:
                properties: { confidence: { const: low } }
              then:
                required: [clarifyingQuestions]
            - $comment: >-
                A regression claim is a bug with both sides of the argument
                and a verdict.
              if:
                required: [regressionVerdict]
              then:
                required:
                  - regressionEvidence
                  - regressionCounterEvidence
                  - regressionVerdictReasoning
                properties: { type: { const: bug } }
            - $comment: >-
                isRegression is the effective flag, as issue-lifecycle's
                triage computes it: true only with a confirmed verdict.
              if:
                required: [isRegression]
                properties: { isRegression: { const: true } }
              then:
                required: [regressionVerdict]
                properties: { regressionVerdict: { const: confirmed } }
            - $comment: A confirmed claim is a regression.
              if:
                required: [regressionVerdict]
                properties: { regressionVerdict: { const: confirmed } }
              then:
                properties: { isRegression: { const: true } }
            - $comment: A downgraded claim is not a regression.
              if:
                required: [regressionVerdict]
                properties: { regressionVerdict: { const: downgraded } }
              then:
                properties: { isRegression: { const: false } }
            - $comment: Only a confirmed regression was introduced somewhere.
              if:
                required: [regressionIntroducedIn]
              then:
                required: [regressionVerdict]
                properties: { regressionVerdict: { const: confirmed } }
    transitions:
      - name: bug
        to: reproduce
        gates:
          - type: evidence-recorded
            config: { name: classification, requireField: { type: bug } }
          - type: evidence-recorded
            config:
              name: classification
              match: { confidence: { enum: [high, medium] } }
              message: >-
                a low-confidence classification waits for the person's
                answers; record it again once they have answered
          - type: human-approval
            description: >-
              A person sees the regression evidence, the counter-argument and
              the verdict before a regression claim goes on, whichever way the
              verdict went. It keys on the verdict, not on isRegression, which
              is false for a downgraded claim. The guard keeps when false, not
              an error, before a classification exists or when it has no
              verdict.
            config:
              id: regression-review
              when: >-
                "classification" in evidence &&
                has(evidence.classification.payload.regressionVerdict)
      - name: feature
        to: plan
        gates:
          - type: evidence-recorded
            config: { name: classification, requireField: { type: feature } }
          - type: evidence-recorded
            config:
              name: classification
              match: { confidence: { enum: [high, medium] } }
              message: >-
                a low-confidence classification waits for the person's
                answers; record it again once they have answered
      - name: platform
        to: plan
        gates:
          - type: evidence-recorded
            config: { name: classification, requireField: { type: platform } }
          - type: evidence-recorded
            config:
              name: classification
              match: { confidence: { enum: [high, medium] } }
              message: >-
                a low-confidence classification waits for the person's
                answers; record it again once they have answered
      - name: security
        to: plan
        gates:
          - type: evidence-recorded
            config: { name: classification, requireField: { type: security } }
          - type: evidence-recorded
            config:
              name: classification
              match: { confidence: { enum: [high, medium] } }
              message: >-
                a low-confidence classification waits for the person's
                answers; record it again once they have answered

  - id: reproduce
    projection: { status: triaged }
    description: >-
      Reproduce the bug before planning a fix. A bug that cannot be
      reproduced goes on to planning only with a person's approval.
    work:
      mode: interactive
      systemPrompt: |
        Reproduce the bug as agent-constraints/triage-conventions.md
        describes for its scope: a failing deno test for an extension, a
        generator diff for codegen, the failing CI run for a publish. Record
        the commands, what you observed verbatim, what was expected, the scope
        the fix belongs in and the blast radius. If it does not reproduce,
        say so and ask the person how to proceed.

        gatorwalk drives this issue: do not use the issue-lifecycle skill or
        run any @swamp/issue-lifecycle method, even when a request would
        trigger it.
      context:
        inject: [classification]
    evidence:
      - name: reproduction
        schema:
          type: object
          required: [reproduced, commands, observed, expected, fixScope]
          additionalProperties: false
          properties:
            reproduced: { type: boolean }
            commands:
              type: array
              minItems: 1
              items: { type: string, minLength: 1 }
            observed: { type: string, minLength: 1 }
            expected: { type: string, minLength: 1 }
            fixScope: { type: string, minLength: 1 }
            blastRadius: { type: string, minLength: 1 }
    transitions:
      - name: reproduced
        to: plan
        gates:
          - type: evidence-recorded
            config: { name: reproduction, requireField: { reproduced: true } }
      - name: not-reproduced
        to: plan
        gates:
          - type: evidence-recorded
            config: { name: reproduction, requireField: { reproduced: false } }
          - type: human-approval
            config: { id: proceed-unreproduced }
      - name: reclassify
        to: triage
        manual: true
        description: >-
          The person declined to go on without a reproduction, or the issue
          is not the bug it looked like. Manual, so it never fires on its own.

  - id: plan
    projection:
      status: triaged
      entries:
        - on: { record: plan }
          cycle: first
          step: plan_generated
          emoji: "📝"
          summary: "Implementation plan generated (v1) — {{summary}}"
          verbose: true
        - on: { record: plan }
          cycle: later
          step: plan_revised
          emoji: "🔄"
          summary: "Plan revised — {{summary}}"
          verbose: true
    description: >-
      Plan the change, following the repository's planning conventions. Five
      plans before a person grants another round: triage, plan, implement and
      pull-request state the default of 5 as the process's choice, so each
      loop has a limit someone chose (swamp-club-swamp-extensions.md, "Cycle
      limits").
    maxCycles: 5
    work:
      mode: interactive
      systemPrompt: |
        Plan the change following agent-constraints/planning-conventions.md.
        Name the files each step touches, the scope and blast radius, how it
        will be tested, and the challenges you expect.

        On a later plan, read the injected plan (the last one), plan-review
        (its review) and plan-feedback (the person's latest feedback); the
        first plan has none of them. After rework, address every open
        critical and high finding of the last review. After revise, address
        the feedback. Record feedbackIncorporated as the last plan's list,
        adding the feedback word for word unless it is already the list's
        last entry: after rework, plan-feedback is the feedback the last plan
        already answered.

        gatorwalk drives this issue: do not use the issue-lifecycle skill or
        run any @swamp/issue-lifecycle method, even when a request would
        trigger it.
      context:
        inject: [classification, plan, plan-review, plan-feedback]
    artifacts:
      - name: plan
        schema:
          type: object
          required: [summary, scopeAnalysis, steps, testingStrategy]
          additionalProperties: false
          properties:
            summary: { type: string, minLength: 1 }
            scopeAnalysis: { type: string, minLength: 1 }
            steps:
              type: array
              minItems: 1
              items:
                type: object
                required: [order, description, files]
                additionalProperties: false
                properties:
                  order: { type: integer, minimum: 1 }
                  description: { type: string, minLength: 1 }
                  files: { type: array, items: { type: string, minLength: 1 } }
                  risks: { type: string, minLength: 1 }
            testingStrategy: { type: string, minLength: 1 }
            potentialChallenges:
              type: array
              items: { type: string, minLength: 1 }
            feedbackIncorporated:
              description: >-
                Every round of a person's plan feedback this plan answers,
                oldest first. plan_revised carries it to the Lab.
              type: array
              items: { type: string, minLength: 1 }
    transitions:
      - name: submit
        to: plan-review
        gates:
          - type: artifact-exists
            config: { artifact: plan }

  - id: plan-review
    projection:
      status: triaged
      entries:
        - on: { record: plan-review }
          step: adversarial_review
          emoji: "🔍"
          summary: "Adversarial review of the plan"
          verbose: true
        - on: { approve: plan-approval }
          step: plan_approved
          emoji: "✅"
          summary: "Plan approved — implementation starting"
          status: in_progress
          verbose: true
    description: >-
      Adversarial review of the current plan. Approval needs a fresh review
      with no open critical or high findings and a person's sign-off; open
      critical or high findings send the plan back, and so can the person.
    work:
      mode: dispatch
      systemPrompt: |
        You are an adversarial reviewer. Try to refute this plan:
        {{planSummary}}
        Challenge it on every dimension in
        agent-constraints/adversarial-dimensions.md and verify each step
        against the code. Report findings with a severity and the dimension
        as category; do not soften them.

        gatorwalk drives this issue: do not use the issue-lifecycle skill or
        run any @swamp/issue-lifecycle method, even when a request would
        trigger it.
      bindings:
        planSummary: artifacts["plan"].payload.summary
      context:
        inject: [plan]
    artifacts:
      - name: plan-review
        kind: findings
        reviews: plan
        schema:
          type: object
          properties:
            findings:
              type: array
              items: { type: object, required: [category] }
    evidence:
      - name: plan-feedback
        description: >-
          A person's feedback on the plan, in their words; revise needs it.
          The round is the cycle it was recorded in.
        recordedBy: person
        schema:
          type: object
          required: [feedback]
          additionalProperties: false
          properties:
            feedback: { type: string, minLength: 1 }
    transitions:
      - name: approve
        to: implement
        gates:
          - type: artifact-fresh
            config: { artifact: plan-review, recordedThisCycle: true }
          - type: findings-clear
            config: { artifact: plan-review, blocking: [critical, high] }
          - type: human-approval
            config: { id: plan-approval }
      - name: rework
        to: plan
        gates:
          - type: artifact-fresh
            config: { artifact: plan-review, recordedThisCycle: true }
          - type: cel
            config:
              expr: >-
                "plan-review" in artifacts &&
                artifacts["plan-review"].payload.findings.exists(f,
                (f.severity == "critical" || f.severity == "high") &&
                !(has(f.resolved) && f.resolved))
              message: rework needs an open critical or high finding
      - name: revise
        to: plan
        manual: true
        description: >-
          The person has feedback on the plan, or declined it without a
          blocking finding. Manual, so it never fires on its own, and the
          person's feedback is recorded first, so every revision carries its
          reason to the next plan.
        gates:
          - type: evidence-recorded
            description: The person's feedback on this plan is recorded.
            config: { name: plan-feedback }

  - id: implement
    projection:
      status: in_progress
      entries:
        - on: enter
          step: implementation_started
          emoji: "🚀"
          summary: "Implementation started"
    description: >-
      Implement the approved plan and commit it. Each pass through
      verification needs a new commit; recheck re-runs it on the same one.
      Five commits through verification before a person grants another round
      (see plan).
    maxCycles: 5
    work:
      mode: interactive
      systemPrompt: |
        Implement the approved plan following
        agent-constraints/implementation-conventions.md. Commit the work, with
        the co-author trailer in the original commit, then record
        change-summary with the full SHA and the branch. After rework, record
        it again for the new commit.

        gatorwalk drives this issue: do not use the issue-lifecycle skill or
        run any @swamp/issue-lifecycle method, even when a request would
        trigger it.
      context:
        inject: [plan, plan-review]
    artifacts:
      - name: change-summary
        schema:
          type: object
          required: [summary, commit, branch, files]
          additionalProperties: false
          properties:
            summary: { type: string, minLength: 1 }
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
            branch: { type: string, pattern: "^[A-Za-z0-9._/-]+$" }
            files: { type: array, minItems: 1, items: { type: string } }
    transitions:
      - name: submit
        to: conformance-review
        gates:
          - type: artifact-exists
            config: { artifact: change-summary }
          - type: cel
            config:
              expr: >-
                !("verification" in evidence) ||
                evidence["verification"].payload.commit !=
                artifacts["change-summary"].payload.commit
              message: >-
                change-summary still names the commit already verified; record
                it for the new commit
      - name: recheck
        to: verify
        manual: true
        description: >-
          Verify the same commit again, for a failure that was not the code's
          (a flaky test, a review provider error). A person decides. Only for
          the commit verification already ran on: a new commit goes through
          conformance-review first.
        gates:
          - type: cel
            config:
              expr: >-
                "verification" in evidence &&
                "change-summary" in artifacts &&
                evidence["verification"].payload.commit ==
                artifacts["change-summary"].payload.commit
              message: >-
                recheck re-verifies the commit verification already ran on; a
                new commit goes through submit

  - id: conformance-review
    projection:
      status: in_progress
      entries:
        - on: { record: conformance }
          step: code_conformance_review
          emoji: "🔍"
          summary: "Code conformance review"
          verbose: true
    description: >-
      Compare the committed code with the approved plan, step by step. Every
      step not implemented as planned needs a justification; recording the
      review again with them is how deviations are justified.
    work:
      mode: dispatch
      systemPrompt: |
        Compare commit {{commit}} with the approved plan. Fetch origin main,
        then read git diff origin/main...{{commit}}. Check each plan step
        against the diff and give it a status: implemented, deviated,
        partially_implemented or missing. Add a step numbered 100 or more,
        with status added, for each change no plan step covers. Justify
        every step not implemented as planned, and judge the code against
        agent-constraints/code-conformance-dimensions.md.

        gatorwalk drives this issue: do not use the issue-lifecycle skill or
        run any @swamp/issue-lifecycle method, even when a request would
        trigger it.
      bindings:
        commit: artifacts["change-summary"].payload.commit
      context:
        inject: [plan, change-summary]
    artifacts:
      - name: conformance
        reviews: change-summary
        schema:
          type: object
          required: [steps]
          additionalProperties: false
          properties:
            steps:
              type: array
              minItems: 1
              items:
                type: object
                required: [order, status, description]
                additionalProperties: false
                properties:
                  order: { type: integer, minimum: 1 }
                  status:
                    enum:
                      - implemented
                      - deviated
                      - partially_implemented
                      - missing
                      - added
                  description: { type: string, minLength: 1 }
                  justification: { type: string, minLength: 1 }
    transitions:
      - name: conforms
        to: verify
        gates:
          - type: artifact-fresh
            config: { artifact: conformance, recordedThisCycle: true }
          - type: cel
            config:
              expr: >-
                artifacts["conformance"].payload.steps.all(s,
                s.status == "implemented" || has(s.justification))
              message: >-
                every step not implemented as planned needs a justification
      - name: rework
        to: implement
        manual: true
        description: >-
          The code has to change to match the plan. A person decides.

  - id: verify
    projection:
      status: in_progress
      entries:
        - on: enter
          step: verification_started
          emoji: "🔍"
          summary: "Verification started"
        - on: { record: verification }
          match: { status: succeeded }
          step: verification_passed
          emoji: "✅"
          summary: "Verification passed for {{commit}}"
        - on: { record: verification }
          match: { status: failed }
          step: verification_failed
          emoji: "❌"
          summary: "Verification failed for {{commit}}"
    description: >-
      The verify workflow at the change-summary commit: verify-build and
      verify-reviews run concurrently as nested runs of one wrapper, and are
      judged together. verify-build runs every check in
      verification/checks.yaml for the directories the change touches, the
      audits, codegen idempotency and the upgrade gate; verify-reviews runs
      the agent reviews the change's paths call for. The wrapper fails if
      either fails, and waits for both. A person then sees the combined
      checklist of both runs and confirms it before the attestation is
      posted. A factory definition is in one stage at a time, so this is how the
      two run in parallel; see DESIGN.md, "Parallel work inside one stage".
    work:
      mode: workflow
      workflow: { name: verify }
      command: >-
        SWAMP_WORKFLOWS_DIR=<absolute path to the checkout>/verification
        swamp workflow run verify --input commit={{commit}}
        --input branch={{branch}} (from a worktree, add --repo-dir with the
        main checkout). The child run ids are each step's output.runId in the
        wrapper's run record; a failed child's is found with swamp workflow
        history search verify-build (or verify-reviews).
      bindings:
        commit: artifacts["change-summary"].payload.commit
        branch: artifacts["change-summary"].payload.branch
      inputsSchema:
        type: object
        required: [commit, branch]
        properties:
          commit: { type: string, pattern: "^[0-9a-f]{40}$" }
          branch: { type: string, pattern: "^[A-Za-z0-9._/-]+$" }
      resultEvidence: verification
    evidence:
      - name: verification
        description: >-
          The wrapper run's outcome and each child's. status and runId are the
          wrapper run's: succeeded only when both children succeeded. A
          child's run id is missing only when it never started.
        schema:
          type: object
          required: [status, runId, commit, buildStatus, reviewsStatus]
          additionalProperties: false
          properties:
            status: { enum: [succeeded, failed] }
            runId: { type: string, minLength: 1 }
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
            buildStatus: { enum: [succeeded, failed] }
            buildRunId: { type: string, minLength: 1 }
            reviewsStatus: { enum: [succeeded, failed] }
            reviewsRunId: { type: string, minLength: 1 }
            outputs: { type: object }
    transitions:
      - name: passed
        to: attest
        gates:
          - type: evidence-recorded
            config:
              name: verification
              requireField: { status: succeeded }
          - type: cel
            config:
              expr: >-
                evidence["verification"].payload.commit ==
                artifacts["change-summary"].payload.commit
              message: verification must have run on the change-summary commit
          - type: cel
            config:
              expr: >-
                evidence["verification"].payload.buildStatus == "succeeded" &&
                evidence["verification"].payload.reviewsStatus == "succeeded"
                && "buildRunId" in evidence["verification"].payload &&
                "reviewsRunId" in evidence["verification"].payload
              message: >-
                both verify-build and verify-reviews must have succeeded, with
                their run ids; status is the wrapper run's own, which fails
                when either child does
          - type: human-approval
            config: { id: checklist-confirmed }
      - name: failed
        to: implement
        gates:
          - type: evidence-recorded
            config: { name: verification, requireField: { status: failed } }
      - name: revise
        to: implement
        manual: true
        description: >-
          The person did not confirm the checklist. Manual, so it never fires
          on its own.

  - id: attest
    projection:
      status: in_progress
      entries:
        - on: { record: attestation }
          step: attestation_posted
          emoji: "📜"
          summary: "Verification attestation posted to swamp-club"
    description: >-
      Build the attestation from the two child runs of verify, post it through
      the swamp-club adapter's post_attestation, and record the id it returns.
      Interactive, not mode method: the attestation is built during the stage,
      and a method call takes only inputs known before it. The pull request
      opens only once a person says so.
    work:
      mode: interactive
      systemPrompt: |
        Build the attestation with deno task build-attestation from run
        {{buildRun}} and run {{reviewsRun}} at commit {{commit}}. Post it with
        the swamp-club adapter's post_attestation (swamp model method run
        <adapter> post_attestation --input attestation=<the JSON>) and record
        the id it logs. Never change the commit after this: the attestation is
        bound to it. Ask the person before opening the pull request.

        gatorwalk drives this issue: do not use the issue-lifecycle skill or
        run any @swamp/issue-lifecycle method, even when a request would
        trigger it.
      bindings:
        commit: artifacts["change-summary"].payload.commit
        buildRun: evidence["verification"].payload.buildRunId
        reviewsRun: evidence["verification"].payload.reviewsRunId
    evidence:
      - name: attestation
        schema:
          type: object
          required: [attestationId, commit, buildRunId, reviewsRunId]
          additionalProperties: false
          properties:
            attestationId: { type: string, minLength: 1 }
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
            buildRunId: { type: string, minLength: 1 }
            reviewsRunId: { type: string, minLength: 1 }
    transitions:
      - name: attested
        to: pull-request
        gates:
          - type: evidence-recorded
            config: { name: attestation }
          - type: cel
            config:
              expr: >-
                evidence["attestation"].payload.commit ==
                artifacts["change-summary"].payload.commit &&
                evidence["attestation"].payload.buildRunId ==
                evidence["verification"].payload.buildRunId &&
                evidence["attestation"].payload.reviewsRunId ==
                evidence["verification"].payload.reviewsRunId
              message: >-
                the attestation must be built from this commit's verify-build
                and verify-reviews runs
          - type: human-approval
            config: { id: open-pr }
      - name: revise
        to: implement
        manual: true
        description: >-
          The person did not want the pull request opened for this commit.
          Manual, so it never fires on its own.
      - name: complete
        to: notify
        manual: true
        description: >-
          issue-lifecycle's complete from implementing: the work is done
          without a pull request. A person decides. issue-lifecycle requires
          conformance and verification to be clear, which here they are once
          the checklist is confirmed; the gates check them again at the
          change-summary commit.
        gates:
          - type: cel
            config:
              expr: >-
                "conformance" in artifacts &&
                artifacts["conformance"].payload.steps.all(s,
                s.status == "implemented" || has(s.justification))
              message: >-
                complete needs a conformance review in which every step not
                implemented as planned has a justification
          - type: cel
            config:
              expr: >-
                "verification" in evidence && "change-summary" in artifacts &&
                evidence["verification"].payload.status == "succeeded" &&
                evidence["verification"].payload.commit ==
                artifacts["change-summary"].payload.commit
              message: >-
                complete needs verification to have passed on the
                change-summary commit
          - type: cel
            config:
              expr: >-
                "verification" in evidence &&
                evidence["verification"].payload.buildStatus == "succeeded" &&
                evidence["verification"].payload.reviewsStatus == "succeeded"
                && "buildRunId" in evidence["verification"].payload &&
                "reviewsRunId" in evidence["verification"].payload
              message: >-
                complete needs both verify-build and verify-reviews to have
                succeeded, with their run ids

  - id: pull-request
    projection:
      status: in_progress
      entries:
        - on: { record: pull-request }
          step: pr_linked
          emoji: "🔗"
          summary: "PR linked: {{url}}"
    description: >-
      Open the pull request for the attested commit. Four replacement pull
      requests before a person grants another (see plan).
    maxCycles: 5
    work:
      mode: interactive
      systemPrompt: |
        Open the pull request for commit {{commit}} with
        fj -H git.swamp-club.com pr create, then record its url.

        gatorwalk drives this issue: do not use the issue-lifecycle skill or
        run any @swamp/issue-lifecycle method, even when a request would
        trigger it.
      bindings:
        commit: artifacts["change-summary"].payload.commit
    evidence:
      - name: pull-request
        schema:
          type: object
          required: [url, commit]
          additionalProperties: false
          properties:
            url: { type: string, format: uri }
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
    transitions:
      - name: opened
        to: merge
        gates:
          - type: evidence-recorded
            config: { name: pull-request }
          - type: cel
            config:
              expr: >-
                evidence["pull-request"].payload.commit ==
                artifacts["change-summary"].payload.commit
              message: the pull request must be for the attested commit

  - id: merge
    projection:
      status: in_progress
      entries:
        - on: { record: merge }
          match: { status: merged }
          step: pr_merged
          emoji: "🎉"
          summary: "PR merged — awaiting release"
        - on: { record: merge }
          match: { status: failed }
          step: pr_failed
          emoji: "❌"
          summary: "PR failed: {{reason}}"
    description: >-
      Wait for CI and the merge. The outcome is reported no sooner than three
      minutes after the pull request was recorded, to give CI time to run. A
      failed pull request goes to a new pull request or back to implement; a
      person decides.
    work:
      mode: interactive
      systemPrompt: |
        Check the pull request {{url}}. When it has merged, record the merge
        commit. If it failed (CI, or it was closed), record why.

        gatorwalk drives this issue: do not use the issue-lifecycle skill or
        run any @swamp/issue-lifecycle method, even when a request would
        trigger it.
      bindings:
        url: evidence["pull-request"].payload.url
    evidence:
      - name: merge
        schema:
          type: object
          required: [status]
          additionalProperties: false
          properties:
            status: { enum: [merged, failed] }
            mergeCommit: { type: string, pattern: "^[0-9a-f]{40}$" }
            reason: { type: string, minLength: 1 }
          allOf:
            - if:
                properties: { status: { const: merged } }
              then:
                required: [mergeCommit]
            - if:
                properties: { status: { const: failed } }
              then:
                required: [reason]
    transitions:
      - name: merged
        to: release
        gates:
          - type: evidence-recorded
            config: { name: merge, requireField: { status: merged } }
          - type: cooldown
            config: { afterEvidence: pull-request, seconds: 180 }
      - name: new-pr
        to: pull-request
        manual: true
        description: >-
          Open a new pull request for the same commit, for a failure that was
          not the code's.
        gates:
          - type: evidence-recorded
            config: { name: merge, requireField: { status: failed } }
          - type: cooldown
            config: { afterEvidence: pull-request, seconds: 180 }
      - name: rework
        to: implement
        manual: true
        description: The pull request failed because of the code; change it.
        gates:
          - type: evidence-recorded
            config: { name: merge, requireField: { status: failed } }
          - type: cooldown
            config: { afterEvidence: pull-request, seconds: 180 }
      - name: complete
        to: notify
        manual: true
        description: >-
          issue-lifecycle's complete from pr_open: the pull request is open
          and a person decides the work is done. Not once a merge outcome is
          recorded for it: issue-lifecycle has left pr_open by then (a merged
          one goes on to release, a failed one to new-pr or rework). No
          cooldown, as issue-lifecycle's complete checks no pull request
          status.
        gates:
          - type: cel
            config:
              expr: >-
                !("merge" in evidence) || evidence["merge"].stage != "merge"
                || evidence["merge"].cycle != stage.cycle
              message: >-
                complete is for an open pull request; a merge outcome is
                already recorded for this one
          - type: cel
            config:
              expr: >-
                "conformance" in artifacts &&
                artifacts["conformance"].payload.steps.all(s,
                s.status == "implemented" || has(s.justification))
              message: >-
                complete needs a conformance review in which every step not
                implemented as planned has a justification
          - type: cel
            config:
              expr: >-
                "verification" in evidence && "change-summary" in artifacts &&
                evidence["verification"].payload.status == "succeeded" &&
                evidence["verification"].payload.commit ==
                artifacts["change-summary"].payload.commit
              message: >-
                complete needs verification to have passed on the
                change-summary commit
          - type: cel
            config:
              expr: >-
                "verification" in evidence &&
                evidence["verification"].payload.buildStatus == "succeeded" &&
                evidence["verification"].payload.reviewsStatus == "succeeded"
                && "buildRunId" in evidence["verification"].payload &&
                "reviewsRunId" in evidence["verification"].payload
              message: >-
                complete needs both verify-build and verify-reviews to have
                succeeded, with their run ids

  - id: release
    projection:
      status: in_progress
      entries:
        - on: { record: release }
          match: { outcome: shipped }
          step: shipped
          emoji: "🚀"
          summary: "Shipped"
          status: shipped
        - on: { record: release }
          match: { outcome: completed }
          step: complete
          emoji: "✅"
          summary: "Complete"
          status: shipped
    description: >-
      Check that the change was released: CI publishes an extension whose
      manifest changed on main. completed is the fallback when there is no
      release build to check.
    work:
      mode: interactive
      systemPrompt: |
        Check the release build for merge commit {{mergeCommit}}. Record
        shipped with the published version once it is in the registry, or
        completed when nothing was published.

        gatorwalk drives this issue: do not use the issue-lifecycle skill or
        run any @swamp/issue-lifecycle method, even when a request would
        trigger it.
      bindings:
        mergeCommit: evidence["merge"].payload.mergeCommit
    evidence:
      - name: release
        schema:
          type: object
          required: [outcome]
          additionalProperties: false
          properties:
            outcome: { enum: [shipped, completed] }
            version:
              type: string
              pattern: "^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}\\.[0-9]+$"
            detail: { type: string, minLength: 1 }
    transitions:
      - name: released
        to: notify
        gates:
          - type: evidence-recorded
            config: { name: release }

  - id: notify
    projection:
      status: shipped
      entries:
        - on: { record: notification }
          match: { action: posted }
          step: contributor_notified
          emoji: "🙏"
          summary: "Thanked @{{author}}"
        - on: { record: notification }
          match: { action: skipped }
          step: notification_skipped
          emoji: "⏭️"
          summary: "Contributor notification skipped: {{reason}}"
    description: >-
      Thank the issue's author, unless they are on the swamp-club team, through
      the swamp-club adapter's thank_author. Interactive, not mode method: when
      the team lookup fails, a person chooses to re-run, force or skip, as
      with issue-lifecycle.
    work:
      mode: interactive
      description: >-
        The prUrl binding is only the pull request for the change-summary
        commit: attest.complete reaches notify with none, or with one from an
        earlier, failed round.
      systemPrompt: |
        Run the swamp-club adapter's thank_author with the issue, summary
        and prUrl values you are given; leave prUrl out when it is null (no
        pull request for this commit, after complete from attest). The
        summary is free text, so never
        paste it into a shell line: write the three as a JSON object to a
        file with your file tool and run swamp model method run <adapter>
        thank_author --input-file <that file> --log. It checks the author
        against the team roster, never GitHub, and posts the thank-you only
        to an author outside the team, and never twice: a re-run finds it
        already posted. Record its action, author and reason. If the lookup
        fails it posts nothing: ask the person whether to re-run it, run it
        with force set to true, or skip, and record skipped with their
        reason.

        gatorwalk drives this issue: do not use the issue-lifecycle skill or
        run any @swamp/issue-lifecycle method, even when a request would
        trigger it.
      bindings:
        issue: item.externalRefs["swamp-club"]
        summary: artifacts["plan"].payload.summary
        prUrl: >-
          "pull-request" in evidence && "change-summary" in artifacts &&
          evidence["pull-request"].payload.commit ==
          artifacts["change-summary"].payload.commit
          ? evidence["pull-request"].payload.url : null
    evidence:
      - name: notification
        schema:
          type: object
          required: [action, author, reason]
          additionalProperties: false
          properties:
            action: { enum: [posted, skipped] }
            author: { type: string, minLength: 1 }
            reason: { type: string, minLength: 1 }
    transitions:
      - name: notified
        to: summary
        gates:
          - type: evidence-recorded
            config: { name: notification }

  - id: summary
    projection:
      status: shipped
      entries:
        - on: { record: summary }
          match: { outcomeMet: true }
          step: session_summarized
          emoji: "📝"
          summary: "Outcome met: {{deliveredOutcome}}"
        - on: { record: summary }
          match: { outcomeMet: false }
          step: session_summarized
          emoji: "📝"
          summary: "Outcome NOT met: {{deliveredOutcome}}"
    description: >-
      Restate the original problem and the delivered outcome, and say whether
      the outcome met the problem.
    work:
      mode: interactive
      systemPrompt: |
        gatorwalk drives this issue: do not use the issue-lifecycle skill or
        run any @swamp/issue-lifecycle method, even when a request would
        trigger it.
      context:
        inject: [plan, change-summary]
    artifacts:
      - name: summary
        schema:
          type: object
          required: [originalProblem, deliveredOutcome, outcomeMet]
          additionalProperties: false
          properties:
            originalProblem: { type: string, minLength: 1 }
            deliveredOutcome: { type: string, minLength: 1 }
            outcomeMet: { type: boolean }
    transitions:
      - name: finish
        to: done
        gates:
          - type: artifact-exists
            config: { artifact: summary }

  - id: done
    terminal: true
    projection: { status: shipped }

  - id: abandoned
    terminal: true
    projection:
      status: closed
      entries:
        - on: enter
          step: abandoned
          emoji: "🛑"
          summary: "Abandoned"

globalTransitions:
  - name: abandon
    to: abandoned
    gates:
      - type: human-approval
        config: { id: abandon-confirmation }

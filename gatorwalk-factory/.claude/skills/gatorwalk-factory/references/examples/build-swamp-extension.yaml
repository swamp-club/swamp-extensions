schemaVersion: 1
name: build-swamp-extension
description: |-
  Build a swamp extension from plan to release: plan it, have the plan
  reviewed, implement it, check it, have the change reviewed, and release it.
  build-swamp-extension.md, beside this factory definition, walks one work item
  through it from start to done.

  For: a developer building their own swamp extension. For other code, start
  from starter.yaml.

  Change first: the release route your repository uses (below), and the
  skills the plan-review and code-review stages load.

  It releases one of two ways. registry-push: `swamp extension push`
  publishes the extension. pull-request: a pull request is merged and CI
  publishes it; a repository that verifies before a pull request opens (as
  swamp-extensions does) records the attestation id.

  People decide at four points: approving the plan, waiving the quality score,
  releasing, and abandoning the work. A person can also always send the work
  back by hand (revise, recheck), so declining an approval never leaves
  abandon as the only way out. Every check and the release are bound to the
  commit named in change-summary, which is the commit that was reviewed.
  Commits are full 40-character SHAs, so the same commit always compares
  equal.

  The CEL vocabulary in bindings and cel gates is defined in
  extensions/models/_lib/engine/cel_context.ts. This factory definition relies
  on one rule of it: in CEL, evidence["x"] is the latest record of x in the era
  from any stage, unlike the evidence-recorded gate, which only accepts evidence
  from the current stage and cycle. implement.submit depends on it.

stages:
  - id: plan
    initial: true
    projection: { status: triaged }
    description: Plan the change to the extension.
    work:
      mode: interactive
      systemPrompt: |
        Plan the change. Name the files each step touches, how it will be
        tested, and whether the manifest version needs a bump (any behaviour
        change to a published extension does).

        On a later plan, read the injected plan (the last one), plan-review
        (its review) and plan-feedback (the person's latest feedback); the
        first plan has none of them. After rework, address the review's open
        critical and high findings. After revise, address the feedback, and
        record feedbackIncorporated: the last plan's list with the latest
        feedback added, word for word.
      context:
        inject: [plan, plan-review, plan-feedback]
    artifacts:
      - name: plan
        schema:
          type: object
          required: [summary, steps, testingStrategy, versionBump]
          properties:
            summary: { type: string, minLength: 1 }
            steps:
              type: array
              minItems: 1
              items:
                type: object
                required: [description, files]
                additionalProperties: false
                properties:
                  description: { type: string, minLength: 1 }
                  files: { type: array, items: { type: string, minLength: 1 } }
            testingStrategy: { type: string, minLength: 1 }
            versionBump:
              type: object
              required: [needed, reason]
              additionalProperties: false
              properties:
                needed: { type: boolean }
                reason: { type: string, minLength: 1 }
            feedbackIncorporated:
              description: >-
                Every round of a person's plan feedback this plan answers,
                oldest first.
              type: array
              items: { type: string, minLength: 1 }
    transitions:
      - name: submit
        to: plan-review
        gates:
          - type: artifact-exists
            config: { artifact: plan }

  - id: plan-review
    projection: { status: triaged }
    description: >-
      Adversarial review of the current plan. Approval needs a fresh review
      with no open critical or high findings and a person's sign-off; open
      critical or high findings send the plan back. Approving carries the open
      medium and low findings into implement, which receives plan-review;
      revise is for when the person wants the plan itself changed and
      reviewed again.
    work:
      mode: dispatch
      systemPrompt: |
        You are an adversarial reviewer. Try to refute this plan:
        {{planSummary}}
        Check its steps against the code, its testing strategy against the
        risks, and whether the version bump call is right.
        Rate a finding critical or high only if the plan would ship a
        defect, lose data, break a stated rule, or make the declared checks
        meaningless. Gaps in process, logistics or manual verification that
        the automated checks already cover are medium at most. Judge the
        plan against the size of the change: do not ask for verification
        machinery bigger than the change, and give the smallest adequate fix
        for each finding. Report findings with severities, and do not soften
        the severity of a real defect.
      bindings:
        planSummary: artifacts["plan"].payload.summary
      context:
        inject: [plan]
    artifacts:
      - name: plan-review
        kind: findings
        reviews: plan
    evidence:
      - name: plan-feedback
        description: >-
          A person's feedback on the plan, in their words; revise needs it.
          The round is the cycle it was recorded in.
        recordedBy: person
        schema:
          type: object
          required: [feedback]
          additionalProperties: false
          properties:
            feedback: { type: string, minLength: 1 }
    transitions:
      - name: approve
        to: implement
        gates:
          - type: artifact-fresh
            config: { artifact: plan-review, recordedThisCycle: true }
          - type: findings-clear
            config: { artifact: plan-review, blocking: [critical, high] }
          - type: human-approval
            config: { id: plan-approval }
      - name: rework
        to: plan
        gates:
          - type: artifact-fresh
            config: { artifact: plan-review, recordedThisCycle: true }
          - type: cel
            config:
              expr: >-
                "plan-review" in artifacts &&
                artifacts["plan-review"].payload.findings.exists(f,
                (f.severity == "critical" || f.severity == "high") &&
                !(has(f.resolved) && f.resolved))
              message: rework needs an open critical or high finding
      - name: revise
        to: plan
        manual: true
        description: >-
          A person declined the plan without a blocking finding, to change
          the plan itself and have it reviewed again. To act on non-blocking
          findings during implement, approve instead. Manual, so it never
          fires on its own, and the person's feedback is recorded first, so
          every revision carries its reason to the next plan.
        gates:
          - type: evidence-recorded
            description: The person's feedback on this plan is recorded.
            config: { name: plan-feedback }

  - id: implement
    projection: { status: in_progress }
    description: Implement the approved plan and commit it.
    work:
      mode: interactive
      systemPrompt: |
        Implement the approved plan. Commit the work, then record
        change-summary with the full SHA of the commit you want checked and
        reviewed. After rework, record it again for the new commit.
      context:
        inject: [plan, plan-review]
    artifacts:
      - name: change-summary
        schema:
          type: object
          required: [summary, commit, files]
          properties:
            summary: { type: string, minLength: 1 }
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
            files: { type: array, minItems: 1, items: { type: string } }
            manifestVersion:
              type: string
              pattern: "^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}\\.[0-9]+$"
    transitions:
      - name: submit
        to: check
        gates:
          - type: artifact-exists
            config: { artifact: change-summary }
          - type: cel
            config:
              expr: >-
                !("checks" in evidence) ||
                evidence["checks"].payload.commit !=
                artifacts["change-summary"].payload.commit
              message: >-
                change-summary still names the commit already checked; record
                it for the new commit
      - name: recheck
        to: check
        manual: true
        description: >-
          Check the same commit again, for a failure that was not the code's
          (a flaky test, a broken tool). A person decides.

  - id: check
    projection: { status: in_progress }
    description: >-
      Run the extension's checks (swamp extension fmt, type check, lint,
      tests) and swamp extension quality on the change-summary commit. An
      extension with no manifest yet cannot be scored; a person can waive the
      quality score instead. If the waiver is granted while a recorded quality
      score also failed, both passed-with-quality-waiver and quality-failed
      are satisfied, and the driver asks which to take. When checks and
      quality both fail, failed and quality-failed are both satisfied; both
      return to implement.
    work:
      mode: interactive
      systemPrompt: |
        Check commit {{commit}}. Run swamp extension fmt, the type check,
        lint and tests, and record checks. Then run
        swamp extension quality --json and record quality from its output,
        adding the commit it scored.
        If the extension has no manifest yet, record checks and ask for the
        quality waiver instead.
      bindings:
        commit: artifacts["change-summary"].payload.commit
    evidence:
      - name: checks
        schema:
          type: object
          required: [commit, status, results]
          properties:
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
            status: { enum: [passed, failed] }
            results:
              type: array
              minItems: 1
              items:
                type: object
                required: [name, status]
                additionalProperties: false
                properties:
                  name: { type: string, minLength: 1 }
                  status: { enum: [passed, failed, skipped] }
                  detail: { type: string }
          $comment: An overall pass cannot contain a failed result.
          if:
            properties: { status: { const: passed } }
          then:
            properties:
              results:
                not:
                  contains:
                    properties: { status: { const: failed } }
      - name: quality
        description: >-
          The output of swamp extension quality --json, plus the commit it
          scored. Only the stable top-level fields are named; the rest is kept
          as recorded.
        schema:
          type: object
          required: [commit, status, allPassed]
          properties:
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
            status: { type: string, minLength: 1 }
            allPassed: { type: boolean }
            rubricVersion: { type: integer }
            earnedPoints: { type: integer, minimum: 0 }
            maxClientEarnablePoints: { type: integer, minimum: 0 }
            percentage: { type: number, minimum: 0, maximum: 100 }
            factors:
              type: array
              items:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, minLength: 1 }
                  status: { type: string, minLength: 1 }
    transitions:
      - name: passed
        to: code-review
        gates:
          - type: evidence-recorded
            config: { name: checks, requireField: { status: passed } }
          - type: evidence-recorded
            config: { name: quality, requireField: { allPassed: true } }
          - type: cel
            config:
              expr: >-
                evidence["checks"].payload.commit ==
                artifacts["change-summary"].payload.commit &&
                "quality" in evidence &&
                evidence["quality"].payload.commit ==
                artifacts["change-summary"].payload.commit
              message: >-
                checks and quality must be for the change-summary commit
      - name: passed-with-quality-waiver
        to: code-review
        gates:
          - type: evidence-recorded
            config: { name: checks, requireField: { status: passed } }
          - type: human-approval
            config: { id: quality-waiver }
          - type: cel
            config:
              expr: >-
                evidence["checks"].payload.commit ==
                artifacts["change-summary"].payload.commit
              message: checks must be for the change-summary commit
      - name: failed
        to: implement
        gates:
          - type: evidence-recorded
            config: { name: checks, requireField: { status: failed } }
      - name: quality-failed
        to: implement
        gates:
          - type: evidence-recorded
            config: { name: quality, requireField: { allPassed: false } }

  - id: code-review
    projection: { status: in_progress }
    description: >-
      Adversarial review of the checked change. Releasing needs a fresh review
      with no open critical or high findings and a person's approval; open
      critical or high findings send the change back.
    work:
      mode: dispatch
      systemPrompt: |
        You are an adversarial reviewer. Review commit {{commit}}:
        {{changeSummary}}
        Check it against the approved plan.
        Rate a finding critical or high only if the change would ship a
        defect, lose data, break a stated rule, or make the declared checks
        meaningless. Gaps in process, logistics or manual verification that
        the automated checks already cover are medium at most. Judge the
        change against the size of the change: do not ask for verification
        machinery bigger than the change, and give the smallest adequate fix
        for each finding. Report findings with severities, and do not soften
        the severity of a real defect.
      bindings:
        commit: artifacts["change-summary"].payload.commit
        changeSummary: artifacts["change-summary"].payload.summary
      context:
        inject: [plan, change-summary, checks]
    artifacts:
      - name: code-review
        kind: findings
        reviews: change-summary
    transitions:
      - name: accept
        to: release
        gates:
          - type: artifact-fresh
            config: { artifact: code-review, recordedThisCycle: true }
          - type: findings-clear
            config: { artifact: code-review, blocking: [critical, high] }
          - type: human-approval
            config: { id: release-approval }
      - name: rework
        to: implement
        gates:
          - type: artifact-fresh
            config: { artifact: code-review, recordedThisCycle: true }
          - type: cel
            config:
              expr: >-
                "code-review" in artifacts &&
                artifacts["code-review"].payload.findings.exists(f,
                (f.severity == "critical" || f.severity == "high") &&
                !(has(f.resolved) && f.resolved))
              message: rework needs an open critical or high finding
      - name: revise
        to: implement
        manual: true
        description: >-
          A person declined the release without a blocking finding; change the
          work. Manual, so it never fires on its own.

  - id: release
    projection: { status: in_progress }
    description: >-
      Release the reviewed commit: swamp extension push, or a pull request
      that CI publishes when it merges. commit is the reviewed head that
      shipped; the merge's own commit goes in mergeCommit, which a
      pull-request release must record, so it cannot be recorded before the
      merge. A registry push must publish the manifestVersion recorded in
      change-summary.
    work:
      mode: interactive
      systemPrompt: |
        Release commit {{commit}}. Either run swamp extension push and record
        the version it published, or open a pull request (after posting the
        verification attestation, where the repository requires one) and
        record the release with its merge commit once it merges.
      bindings:
        commit: artifacts["change-summary"].payload.commit
    evidence:
      - name: release
        schema:
          type: object
          required: [via, commit, url]
          properties:
            via: { enum: [registry-push, pull-request] }
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
            mergeCommit: { type: string, pattern: "^[0-9a-f]{40}$" }
            url: { type: string, format: uri }
            version:
              type: string
              pattern: "^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}\\.[0-9]+$"
            pullRequest: { type: string, format: uri }
            attestationId: { type: string, minLength: 1 }
          allOf:
            - if:
                properties: { via: { const: registry-push } }
              then:
                required: [version]
            - if:
                properties: { via: { const: pull-request } }
              then:
                required: [pullRequest, attestationId, mergeCommit]
    transitions:
      - name: released
        to: done
        gates:
          - type: evidence-recorded
            config: { name: release }
          - type: cel
            config:
              expr: >-
                evidence["release"].payload.commit ==
                artifacts["change-summary"].payload.commit
              message: the release must ship the reviewed commit
          - type: cel
            config:
              expr: >-
                evidence["release"].payload.via != "registry-push" ||
                ("manifestVersion" in artifacts["change-summary"].payload &&
                evidence["release"].payload.version ==
                artifacts["change-summary"].payload.manifestVersion)
              message: >-
                a registry push must publish the manifestVersion recorded in
                change-summary
      - name: rework
        to: implement
        manual: true
        description: The release was blocked; go back and change the work.

  - id: done
    terminal: true
    projection: { status: shipped }

  - id: abandoned
    terminal: true
    projection: { status: closed }

globalTransitions:
  - name: abandon
    to: abandoned
    gates:
      - type: human-approval
        config: { id: abandon-confirmation }

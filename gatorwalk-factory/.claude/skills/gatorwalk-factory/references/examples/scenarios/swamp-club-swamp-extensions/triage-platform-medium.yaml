scenario: triage-platform-medium
factory: swamp-club-swamp-extensions
description: >-
  A low-confidence platform classification holds triage's platform exit until it is
  recorded again with the person's answer; medium confidence lets it through.
  High confidence is walked by the other scenarios.
steps:
  - record: { evidence: classification }
    payload:
      type: platform
      confidence: low
      reasoning: Unsure
      isRegression: false
      clarifyingQuestions: [Which is it?]
  - move: platform
    expect: { refused: "waits for the person's answers" }
  - record: { evidence: classification }
    payload: {
      type: platform,
      confidence: medium,
      reasoning: Clear,
      isRegression: false,
    }
  - move: platform
  - expect: { stage: plan }

scenario: triage-security-medium
factory: swamp-club-swamp-extensions
description: >-
  A low-confidence security classification holds triage's security exit until it is
  recorded again with the person's answer; medium confidence lets it through.
  High confidence is walked by the other scenarios.
steps:
  - record: { evidence: classification }
    payload:
      type: security
      confidence: low
      reasoning: Unsure
      isRegression: false
      clarifyingQuestions: [Which is it?]
  - move: security
    expect: { refused: "waits for the person's answers" }
  - record: { evidence: classification }
    payload: {
      type: security,
      confidence: medium,
      reasoning: Clear,
      isRegression: false,
    }
  - move: security
  - expect: { stage: plan }

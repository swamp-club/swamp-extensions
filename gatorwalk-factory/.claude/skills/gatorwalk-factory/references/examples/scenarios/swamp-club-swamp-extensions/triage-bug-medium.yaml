scenario: triage-bug-medium
factory: swamp-club-swamp-extensions
description: >-
  A low-confidence bug classification holds triage's bug exit until it is
  recorded again with the person's answer; medium confidence lets it through.
  High confidence is walked by the other scenarios.
steps:
  - record: { evidence: classification }
    payload:
      type: bug
      confidence: low
      reasoning: Unsure
      isRegression: false
      clarifyingQuestions: [Which is it?]
  - move: bug
    expect: { refused: "waits for the person's answers" }
  - record: { evidence: classification }
    payload: {
      type: bug,
      confidence: medium,
      reasoning: Clear,
      isRegression: false,
    }
  - move: bug
  - expect: { stage: reproduce }

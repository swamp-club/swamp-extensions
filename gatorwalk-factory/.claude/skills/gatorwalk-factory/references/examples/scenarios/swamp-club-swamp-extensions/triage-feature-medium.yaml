scenario: triage-feature-medium
factory: swamp-club-swamp-extensions
description: >-
  A low-confidence feature classification holds triage's feature exit until it is
  recorded again with the person's answer; medium confidence lets it through.
  High confidence is walked by the other scenarios.
steps:
  - record: { evidence: classification }
    payload:
      type: feature
      confidence: low
      reasoning: Unsure
      isRegression: false
      clarifyingQuestions: [Which is it?]
  - move: feature
    expect: { refused: "waits for the person's answers" }
  - record: { evidence: classification }
    payload: {
      type: feature,
      confidence: medium,
      reasoning: Clear,
      isRegression: false,
    }
  - move: feature
  - expect: { stage: plan }
